<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>田园小屋搭建</title>
<style>
  :root {
    --paper: #F1EEE6; --paper-2: #E8E3D7; --ink: #3A342B; --ink-2: #6E6657; --line: #D5CEBE;
    --accent: #A9614B; --code-bg: #26231E; --code-bg-2: #2F2B25; --code-line: #3B362E;
    --code-ink: #D9D2C3; --code-dim: #7F7767; --tk-fn: #E0BF85; --tk-str: #A9BC8A; --tk-num: #D99A73; --tk-id: #93AEB6;
    --active: rgba(224,191,133,.2); --flight: rgba(224,191,133,.07);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 60fr 40fr; height: 100vh; height: 100dvh; }
  .stage-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud { position: absolute; top: 14px; left: 14px; width: 196px; padding: 11px 13px; font-size: 12px; line-height: 1.5;
    background: rgba(241,238,230,.86); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(6px); }
  .hud h1 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .hud dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .hud dd { margin: 0; text-align: right; color: var(--ink); }
  .hud label { display: block; margin-top: 8px; color: var(--ink-2); }
  .hud input[type=range] { width: 100%; margin: 3px 0 0; accent-color: var(--accent); display: block; }
  .chip { position: absolute; top: 14px; right: 14px; padding: 5px 11px; font-size: 12px; background: rgba(241,238,230,.86);
    border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); }
  .chip[aria-pressed=true] { color: var(--ink); border-color: var(--accent); }

  .controls { flex: none; padding: 10px 16px 12px; background: var(--paper-2); border-top: 1px solid var(--line); }
  .ctl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; }
  .icon-btn:hover { background: #fff9ec; }
  .icon-btn.primary { background: var(--accent); border-color: var(--accent); color: #FBF6EA; }
  .icon-btn.primary:hover { background: #B86E56; }
  .icon-btn svg { width: 15px; height: 15px; fill: currentColor; }
  .step-title { font-size: 14px; font-weight: 600; margin-left: 6px; min-width: 0; flex: 1 1 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .speed { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .speed button { border: 0; background: var(--paper); padding: 6px 9px; font-size: 12px; border-right: 1px solid var(--line); }
  .speed button:last-child { border-right: 0; }
  .speed button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
  .scrub-wrap { position: relative; margin-top: 8px; height: 22px; }
  .scrub { position: absolute; inset: 0; width: 100%; height: 22px; margin: 0; accent-color: var(--accent); background: transparent; }
  .ticks { position: absolute; left: 8px; right: 8px; top: 0; bottom: 0; pointer-events: none; }
  .ticks i { position: absolute; top: 4px; width: 1px; height: 4px; background: var(--ink-2); opacity: .55; }

  .code-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--code-bg); color: var(--code-ink); }
  .code-head { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--code-line); font-size: 13px; }
  .code-head b { font-weight: 600; }
  .code-head span { color: var(--code-dim); font-size: 12px; }
  .code-scroll { position: relative; flex: 1; min-height: 0; overflow: auto; padding: 4px 0 40vh;
    font: 12.5px/20px ui-monospace, "SF Mono", Menlo, Consolas, monospace; scrollbar-color: var(--code-line) transparent; }
  .ln { display: flex; min-height: 20px; white-space: pre; }
  .ln .no { flex: none; width: 46px; padding-right: 12px; text-align: right; color: var(--code-dim); user-select: none; }
  .ln .tx { flex: 1; padding-right: 16px; }
  .ln.op { cursor: pointer; }
  .ln.op:hover { background: var(--code-bg-2); }
  .ln.flight { background: var(--flight); }
  .ln.current { background: var(--active); box-shadow: inset 2px 0 0 var(--tk-fn); }
  .ln.current .no { color: var(--tk-fn); }
  .stage-head { position: sticky; top: 0; z-index: 2; display: flex; width: 100%; padding: 3px 0; text-align: left; border: 0; border-top: 1px solid var(--code-line);
    background: var(--code-bg-2); font: inherit; color: inherit; }
  .stage-head:hover { background: var(--code-line); }
  .stage-head.now { box-shadow: inset 2px 0 0 var(--tk-fn); }
  .stage-head .no { flex: none; width: 46px; padding-right: 12px; text-align: right; color: var(--code-dim); }
  .stage-head .tx { flex: 1; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .stage-head .meta { flex: none; display: flex; align-items: center; gap: 8px; padding-right: 12px; color: var(--code-dim); font-size: 11px; }
  .stage-head .chev { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
  .stage-head[aria-expanded=true] .chev { transform: rotate(45deg); }
  .stage-body[hidden] { display: none; }
  .t-fn { color: var(--tk-fn); } .t-str { color: var(--tk-str); } .t-num { color: var(--tk-num); } .t-id { color: var(--tk-id); }
  .t-com { color: var(--code-dim); font-style: italic; } .t-p { color: #9C9484; }

  .tools { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--code-line); font-size: 12px; }
  .tools button, .tools input[type=text] { height: 30px; padding: 0 10px; background: var(--code-bg-2); color: var(--code-ink); border: 1px solid var(--code-line); border-radius: 6px; font-size: 12px; }
  .tools button:hover { background: var(--code-line); }
  .tools button[disabled] { opacity: .45; cursor: not-allowed; }
  .tools button.rec { border-color: #D99A73; color: #E9B595; }
  .tools label { display: inline-flex; align-items: center; gap: 6px; color: var(--code-dim); }
  .tools input[type=text] { width: 86px; }
  .tools input[type=checkbox] { accent-color: var(--tk-fn); margin: 0; }
  .note { flex-basis: 100%; color: var(--code-dim); min-height: 0; }
  .note:empty { display: none; }

  .fatal { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; background: var(--paper); z-index: 10; }
  .fatal div { max-width: 480px; line-height: 1.7; }
  .fatal h2 { margin: 0 0 8px; font-size: 18px; }
  .fatal code { display: block; margin-top: 8px; font-size: 12px; white-space: pre-wrap; color: var(--ink-2); }

  @media (max-width: 900px) {
    html, body { height: auto; }
    .app { display: block; height: auto; }
    .viewport { flex: none; height: 56vh; min-height: 320px; }
    .code-pane { height: 70vh; }
    .hud { width: 164px; top: 10px; left: 10px; padding: 8px 10px; }
    .chip { top: 10px; right: 10px; }
    .step-title { flex-basis: 100%; order: 5; margin-left: 0; }
    .code-head, .tools { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .stage-head .chev { transition: none; } }
</style>

<body>
<main class="app">
  <section class="stage-pane">
    <div class="viewport" id="viewport">
      <canvas id="scene" aria-label="田园小屋搭建过程的 3D 场景"></canvas>
      <div class="hud">
        <h1>田园小屋搭建</h1>
        <dl>
          <dt>三角面</dt><dd id="stat-tris">–</dd>
          <dt>FPS</dt><dd id="stat-fps">–</dd>
        </dl>
        <label for="light">光源方位角 <span id="light-val"></span></label>
        <input id="light" type="range" min="0" max="360" step="1" value="325">
      </div>
      <button class="chip" id="auto-cam" aria-pressed="true" title="拖动场景后自动镜头会关闭，点此恢复">自动镜头</button>
    </div>
    <div class="controls">
      <div class="ctl-row">
        <button class="icon-btn" id="prev" aria-label="上一步" title="上一步"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
        <button class="icon-btn primary" id="play" aria-label="播放或暂停"><svg viewBox="0 0 16 16" id="play-ico"></svg></button>
        <button class="icon-btn" id="next" aria-label="下一步" title="下一步"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
        <div class="step-title" id="step-title" aria-live="off"></div>
        <span class="time" id="time"></span>
        <div class="speed" id="speed" role="group" aria-label="播放速度">
          <button data-speed="0.5" aria-pressed="false">0.5x</button>
          <button data-speed="1" aria-pressed="true">1x</button>
          <button data-speed="2" aria-pressed="false">2x</button>
          <button data-speed="4" aria-pressed="false">4x</button>
        </div>
      </div>
      <div class="scrub-wrap">
        <input class="scrub" id="scrub" type="range" min="0" step="0.01" value="0" aria-label="播放进度">
        <div class="ticks" id="ticks"></div>
      </div>
    </div>
  </section>
  <aside class="code-pane">
    <div class="code-head"><b>施工脚本</b><span id="code-meta"></span></div>
    <div class="code-scroll" id="code"></div>
    <div class="tools">
      <button id="replay">重新播放</button>
      <button id="record">录制 webm</button>
      <button id="export">导出时间轴 JSON</button>
      <label>随机种子 <input id="seed" type="text" value="cottage" spellcheck="false" autocomplete="off"></label>
      <label><input id="loop" type="checkbox"> 循环</label>
      <div class="note" id="note"></div>
    </div>
  </aside>
</main>
<div class="fatal" id="fatal"><div><h2 id="fatal-title"></h2><span id="fatal-text"></span><code id="fatal-detail"></code></div></div>

// 木门

    const v = lo + (1 - lo) * smooth((pos.getY(i) - a) / h);
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = v;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

class GeoLib {
  constructor() { this.defs = new Map(); }
  reg(key, make, mat = 'std') { if (!this.defs.has(key)) this.defs.set(key, { make, mat }); return key; }
  box(w, h, d, r) {
    const rad = r ?? Math.min(.035, Math.min(w, h, d) * .4);
    return this.reg(`box:${w}:${h}:${d}:${rad}`, () => shadeY(new RoundedBoxGeometry(w, h, d, 1, rad)));
  }
  hard(w, h, d) { return this.reg(`hard:${w}:${h}:${d}`, () => shadeY(new THREE.BoxGeometry(w, h, d), .96)); }
  cyl(rt, rb, h, seg = 10) { return this.reg(`cyl:${rt}:${rb}:${h}:${seg}`, () => shadeY(new THREE.CylinderGeometry(rt, rb, h, seg))); }
  cone(r, h, seg = 5) { return this.reg(`cone:${r}:${h}:${seg}`, () => shadeY(new THREE.ConeGeometry(r, h, seg).translate(0, h / 2, 0), .7)); }
  ball(seg = 12) { return this.reg(`ball:${seg}`, () => shadeY(new THREE.SphereGeometry(1, seg, Math.ceil(seg * .7)), .78)); }
  rock(detail = 0) { return this.reg(`rock:${detail}`, () => shadeY(new THREE.IcosahedronGeometry(1, detail), .78), 'flat'); }
}

class Actor {
  constructor(ev, x, y, z, opts = {}) {
    this.ev = ev; this.x = x; this.y = y; this.z = z;
    this.ry = opts.ry || 0; this.h = opts.h ?? 6; this.perPart = !!opts.perPart;
    this.live = !!opts.live; this.motion = null;
    this.parts = []; this.contacts = []; this.lastP = 0; this.tris = 0;
  }
}

class World {
  constructor(canvas) {
    this.canvas = canvas;
    const r = this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.outputColorSpace = THREE.SRGBColorSpace;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    r.shadowMap.autoUpdate = false;

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color('#F1EEE6');
    this.camera = new THREE.OrthographicCamera(-20, 20, 20, -20, 1, 260);
    this.target = new THREE.Vector3(0, -1.2, 0);
    this.autoCam = true;
    this.azim0 = Math.PI / 4; this.elev = Math.atan(1 / Math.SQRT2);
    this.controls = new OrbitControls(this.camera, canvas);
    Object.assign(this.controls, { enableDamping: true, dampingFactor: .08, minZoom: .6, maxZoom: 7, maxPolarAngle: 1.42 });
    this.onUserCamera = null;
    this.controls.addEventListener('start', () => { if (this.autoCam) { this.autoCam = false; this.onUserCamera?.(); } });

    this.scene.add(new THREE.HemisphereLight('#F7F1E2', '#BDAE92', 1.55));
    this.sun = new THREE.DirectionalLight('#FFF3DF', 2.4);
    const sc = this.sun.shadow;
    sc.mapSize.set(4096, 4096);
    Object.assign(sc.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 5, far: 110 });
    sc.bias = -.00025; sc.normalBias = .03;
    this.sun.castShadow = true;
    this.scene.add(this.sun, this.sun.target);

    this.materials = {
      std: new THREE.MeshStandardMaterial({ roughness: .9, metalness: 0, vertexColors: true }),
      flat: new THREE.MeshStandardMaterial({ roughness: .9, metalness: 0, vertexColors: true, flatShading: true }),
      water: new THREE.MeshStandardMaterial({ roughness: .55, metalness: 0, vertexColors: true }),
    };
    this.softTex = this.makeSoftTexture();
    this.makeFloorShadow();
    this.root = null; this.actors = []; this.buckets = new Map(); this.lastT = NaN; this.needShadow = true;
    this.glow = null;
  }

  // ---------- 贴地软影 ----------
  makeSoftTexture() {
    const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    g.shadowColor = 'rgba(52,40,26,1)'; g.shadowBlur = 22; g.shadowOffsetX = S * 2;
    g.fillStyle = '#000'; g.fillRect(S * .22 - S * 2, S * .22, S * .56, S * .56);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  makeFloorShadow() {
    const c = this.floorCanvas = document.createElement('canvas'); c.width = c.height = 512;
    this.floorTex = new THREE.CanvasTexture(c); this.floorTex.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.MeshBasicMaterial({ map: this.floorTex, transparent: true, depthWrite: false, toneMapped: false });
    this.floor = new THREE.Mesh(new THREE.PlaneGeometry(96, 96), m);
    this.floor.rotation.x = -Math.PI / 2; this.floor.position.y = -9.5; this.floor.renderOrder = -1;
    this.scene.add(this.floor);
  }
  setLight(deg) {
    const a = THREE.MathUtils.degToRad(deg), el = THREE.MathUtils.degToRad(46);
    const dir = new THREE.Vector3(Math.sin(a) * Math.cos(el), Math.sin(el), Math.cos(a) * Math.cos(el));
    this.sun.position.copy(dir).multiplyScalar(55);
    this.sun.target.position.set(0, 0, 0);
    this.sun.target.updateMatrixWorld();
    // 地块在下方地面的投影：上下两个方形的外包多边形，模糊后得到柔和长影
    const g = this.floorCanvas.getContext('2d'), S = 512, u = S / 96, k = 1 / Math.tan(el);
    const pts = [];
    for (const hgt of [4.5, 9.5]) for (const [x, z] of [[-PLOT, -PLOT], [PLOT, -PLOT], [PLOT, PLOT], [-PLOT, PLOT]]) {
      pts.push([S / 2 + (x - dir.x / Math.cos(el) * hgt * k) * u, S / 2 + (z - dir.z / Math.cos(el) * hgt * k) * u]);
    }
    const hull = convexHull(pts);
    g.clearRect(0, 0, S, S);
    g.save();
    g.shadowColor = 'rgba(92,72,50,.34)'; g.shadowBlur = 26; g.shadowOffsetX = S * 2;
    g.beginPath(); hull.forEach(([x, y], i) => i ? g.lineTo(x - S * 2, y) : g.moveTo(x - S * 2, y)); g.closePath();
    g.fillStyle = '#000'; g.fill();
    g.restore();
    this.floorTex.needsUpdate = true;
    this.needShadow = true;
  }

  // ---------- 构建 ----------
  build(timeline, seed) {
    this.dispose();
    this.timeline = timeline; this.seed = seed;
    this.root = new THREE.Group(); this.scene.add(this.root);
    const ctx = new BuildContext(this, seed);
    this.orbit = null;
    for (const ev of timeline.events) {
      const fn = BUILDERS[ev.op];
      if (!fn) throw new Error(`第 ${ev.line} 行：指令 ${ev.op} 没有实现`);
      fn(ctx, ev, ...ev.args);
    }
    this.finishBuckets(ctx);
    this.lastT = NaN;
    this.lineActors = new Map();
    for (const a of this.actors) { const l = this.lineActors.get(a.ev.line) || []; l.push(a); this.lineActors.set(a.ev.line, l); }
    this.peakTris = this.actors.reduce((s, a) => s + a.tris, 0);
  }
  finishBuckets(ctx) {
    for (const [key, parts] of ctx.bucketParts) {
      const def = ctx.geo.defs.get(key);
      const geo = def.make();
      const mat = this.materials[def.mat];
      const mesh = new THREE.InstancedMesh(geo, mat, parts.length);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.frustumCulled = false;
      mesh.castShadow = !ctx.noCast.has(key);
      mesh.receiveShadow = true;
      const triCount = (geo.index ? geo.index.count : geo.attributes.position.count) / 3;
      parts.forEach((p, i) => {
        p.mesh = mesh; p.i = i; p.tris = triCount;
        mesh.setMatrixAt(i, ZERO); mesh.setColorAt(i, p.color);
        p.actor.tris += triCount;
      });
      mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
      this.buckets.set(key, mesh);
      this.root.add(mesh);
    }
  }
  dispose() {
    if (!this.root) return;
    this.scene.remove(this.root);
    for (const mesh of this.buckets.values()) { mesh.geometry.dispose(); mesh.dispose(); }
    for (const a of this.actors) for (const c of a.contacts) c.mesh.material.dispose();
    this.buckets.clear(); this.actors = []; this.glow = null;
    this.contactGeo?.dispose(); this.contactGeo = null;
  }

  // ---------- 画面 = f(t) ----------
  applyActor(a, t) {
    const e = a.ev, p = clamp01((t - e.start) / e.duration);
    if (p === 0 && a.lastP === 0) return;
    if (!a.live && p === a.lastP) return;
    a.lastP = p;
    for (const c of a.contacts) c.mesh.material.opacity = c.opacity * smooth(p * 1.4);
    if (p === 0) { for (const part of a.parts) { part.mesh.setMatrixAt(part.i, ZERO); part.mesh.instanceMatrix.needsUpdate = true; } return; }
    if (a.motion) a.motion(t, a);
    const pose = ANIMS[e.anim](p, a.h);
    _v.set(a.x, a.y + pose.y, a.z);
    _q.setFromAxisAngle(_up, a.ry);
    if (a.perPart) {
      _v2.set(1, 1, 1); _b.compose(_v, _q, _v2);
      _s.makeScale(pose.sx, pose.sy, pose.sz);
    } else {
      _v2.set(pose.sx, pose.sy, pose.sz); _b.compose(_v, _q, _v2);
    }
    for (const part of a.parts) {
      const local = part.dyn ? part.dyn(t, _l) : part.local;
      _m.multiplyMatrices(_b, local);
      if (a.perPart) _m.multiply(_s);
      if (part.post) part.post(_m, t);
      part.mesh.setMatrixAt(part.i, _m);
      part.mesh.instanceMatrix.needsUpdate = true;
    }
  }
  cameraPose(t) {
    let az = this.azim0;
    if (this.orbit) {
      const tau = Math.max(0, t - this.orbit.start), ramp = 1.5;
      const turn = tau < ramp ? tau * tau / (2 * ramp) : tau - ramp / 2;
      az += THREE.MathUtils.degToRad(this.orbit.speed) * turn;
    }
    const d = 110, ce = Math.cos(this.elev);
    this.camera.position.set(this.target.x + Math.sin(az) * ce * d, this.target.y + Math.sin(this.elev) * d, this.target.z + Math.cos(az) * ce * d);
    this.camera.lookAt(this.target);
  }
  render(t) {
    const changed = t !== this.lastT;
    if (changed) {
      for (const a of this.actors) this.applyActor(a, t);
      const plot = this.floorActor;
      if (plot) this.floor.material.opacity = smooth(clamp01((t - plot.ev.start) / plot.ev.duration));
      this.lastT = t;
      this.needShadow = true;
    }
    if (this.autoCam) { this.cameraPose(t); }
    else this.controls.update();
    this.updateGlow();
    if (this.needShadow) { this.renderer.shadowMap.needsUpdate = true; this.needShadow = false; }
    this.renderer.render(this.scene, this.camera);
  }
  setAutoCam(on) {
    this.autoCam = on;
    if (on) { this.camera.zoom = 1; this.target.set(0, -1.2, 0); this.controls.target.copy(this.target); this.camera.updateProjectionMatrix(); }
    else this.controls.target.copy(this.target);
  }
  resize(w, h) {
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(w, h, false);
    const aspect = w / h, halfH = Math.max(19, 20 / aspect), halfW = halfH * aspect;
    Object.assign(this.camera, { left: -halfW, right: halfW, top: halfH, bottom: -halfH });
    this.camera.updateProjectionMatrix();
  }

  // ---------- 悬停发光（界面效果，和 t 无关） ----------
  setGlow(line) {
    if (this.glow) this.paintGlow(this.glow.line, 0);
    this.glow = line == null ? null : { line, start: performance.now() };
  }
  paintGlow(line, k) {
    const list = this.lineActors?.get(line) || [];
    for (const a of list) for (const part of a.parts) {
      _c.copy(part.color).multiplyScalar(1 + k * 1.3);
      _c.r += k * .08; _c.g += k * .06; _c.b += k * .02;
      part.mesh.setColorAt(part.i, _c);
      part.mesh.instanceColor.needsUpdate = true;
    }
  }
  updateGlow() {
    if (!this.glow) return;
    const age = (performance.now() - this.glow.start) / 900;
    if (age >= 1) { this.paintGlow(this.glow.line, 0); this.glow = null; return; }
    this.paintGlow(this.glow.line, Math.sin(Math.PI * age));
  }
  stats() {
    let tris = 0;
    for (const a of this.actors) if (a.lastP > 0) tris += a.tris;
    return { tris, peak: this.peakTris };
  }
  // 校验用：当前所有实例矩阵和相机的摘要，相同的 t 必须得到相同的值
  stateHash() {
    let h = 0x811c9dc5;
    const mix = f => { h ^= Math.round(f * 1000); h = Math.imul(h, 0x01000193); };
    for (const key of [...this.buckets.keys()].sort()) { const arr = this.buckets.get(key).instanceMatrix.array; for (let i = 0; i < arr.length; i++) mix(arr[i]); }
    this.camera.position.toArray().forEach(mix);
    return h >>> 0;
  }
}

function convexHull(points) {
  const p = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const half = list => { const s = []; for (const q of list) { while (s.length > 1 && cross(s[s.length - 2], s[s.length - 1], q) <= 0) s.pop(); s.push(q); } s.pop(); return s; };
  return [...half(p), ...half(p.reverse())];
}

// ===================================================================
// 构建上下文：把一条指令变成若干实例
// ===================================================================
class BuildContext {
  constructor(world, seed) {
    this.world = world; this.seed = seed;
    this.geo = new GeoLib(); this.bucketParts = new Map(); this.noCast = new Set(); this.refs = {};
    world.contactGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
  }
  rng(ev) { return mulberry32(hashStr(`${this.seed}|${ev.id}`)); }
  actor(ev, x = 0, y = 0, z = 0, opts) {
    const a = new Actor(ev, x, y, z, opts);
    this.world.actors.push(a);
    return a;
  }
  color(name, rng, amount = .03) {
    const c = new THREE.Color(PAL[name] || name);
    if (rng) c.offsetHSL(0, 0, (rng() * 2 - 1) * amount * .5);
    return c;
  }
  add(a, key, colorName, o = {}) {
    const part = { actor: a, local: o.m || mat4(o.p, o.r, o.s), color: colorName instanceof THREE.Color ? colorName : this.color(colorName, o.rng, o.amount), dyn: o.dyn, post: o.post };
    if (!this.bucketParts.has(key)) this.bucketParts.set(key, []);
    this.bucketParts.get(key).push(part);
    a.parts.push(part);
    if (o.noCast) this.noCast.add(key);
    return part;
  }
  contact(a, x, z, w, d, opacity = .3, ry = 0) {
    const mat = new THREE.MeshBasicMaterial({ map: this.world.softTex, transparent: true, depthWrite: false, opacity: 0, toneMapped: false });
    const mesh = new THREE.Mesh(this.world.contactGeo, mat);
    mesh.position.set(x, .02, z); mesh.rotation.y = ry; mesh.scale.set(w * 1.8, 1, d * 1.8);
    mesh.renderOrder = 1;
    this.world.root.add(mesh);
    a.contacts.push({ mesh, opacity });
  }
  isFree(x, z) {
    if (Math.abs(x) > PLOT - .2 || Math.abs(z) > PLOT - .2) return false;
    if (x > H.x0 - .4 && x < H.x1 + .4 && z > H.zb - .4 && z < H.zf + .4) return false;
    if (x > -4.9 && x < -3.1) return false;
    if (x > 4.3 && x < 10.9 && z > -10.9 && z < -2.3) return false;
    const pd = Math.hypot(x - 6.8, z - 6.8);
    if (pd < 4.1) return false;
    if (Math.hypot(x + 8.2, z - 8.4) < .9) return false;
    return true;
  }
}

// 随风摇摆：只改矩阵的 Y 列，代价很小，且只依赖 t
const swayPost = amp => (m, t) => {
  const e = m.elements, x = e[12], z = e[14];
  const w = Math.sin(t * 1.7 + x * .6 + z * .45) * amp + Math.sin(t * 3.1 + x * 1.3) * amp * .35;
  e[4] += w * e[5]; e[6] += w * .6 * e[5];
};

// 不规则的圆润水面：极坐标网格，中心深、岸边浅
function blobDisc(seed, radius, rings, yAt, colorAt) {
  const rnd = mulberry32(hashStr(seed + '|pond'));
  const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28], seg = 72;
  const R = a => radius * (1 + .07 * Math.sin(2 * a + ph[0]) + .05 * Math.sin(3 * a + ph[1]) + .025 * Math.sin(5 * a + ph[2]));
  const pos = [0, yAt(0), 0], col = [...colorAt(0)], idx = [];
  for (let r = 1; r <= rings; r++) for (let s = 0; s < seg; s++) {
    const a = s / seg * Math.PI * 2, k = r / rings, q = R(a) * k;
    pos.push(Math.cos(a) * q, yAt(k), Math.sin(a) * q);
    col.push(...colorAt(k));
  }
  for (let s = 0; s < seg; s++) idx.push(0, 1 + (s + 1) % seg, 1 + s);
  for (let r = 0; r < rings - 1; r++) for (let s = 0; s < seg; s++) {
    const a = 1 + r * seg + s, b = 1 + r * seg + (s + 1) % seg, c = a + seg, d = b + seg;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

// ===================================================================
// 指令实现：每条脚本指令对应一个函数
// ===================================================================
const BUILDERS = {
  // —— 地块 ——
  soil(c, ev, y, h, tone) {
    const a = c.actor(ev, 0, y - h / 2, 0, { h: 24 });
    c.add(a, c.geo.hard(PLOT * 2, h, PLOT * 2), tone);
    c.world.floorActor = a;   // 最后一层到位时，地面长影也完全显现
  },
  grassTop(c, ev) {
    const a = c.actor(ev, 0, 0, 0, { h: 24 });
    const rnd = c.rng(ev), ph = [rnd() * 6, rnd() * 6, rnd() * 6, rnd() * 6];
    const key = c.geo.reg('ground', () => {
      const g = new THREE.PlaneGeometry(PLOT * 2, PLOT * 2, 48, 48).rotateX(-Math.PI / 2);
      const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
      const A = new THREE.Color(PAL.grass), B = new THREE.Color(PAL.moss), C = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const n = .5 + .28 * Math.sin(x * .42 + ph[0]) * Math.cos(z * .37 + ph[1]) + .22 * Math.sin(x * .9 + z * .7 + ph[2]) * Math.sin(z * 1.1 - x * .3 + ph[3]);
        C.copy(A).lerp(B, clamp01(n) * .55);
        col[i * 3] = C.r; col[i * 3 + 1] = C.g; col[i * 3 + 2] = C.b;
      }
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      return g;
    });
    c.noCast.add(key);
    c.add(a, key, '#FFFFFF');
    c.add(a, c.geo.hard(PLOT * 2, .3, PLOT * 2), 'grass', { p: [0, -.16, 0] });
  },
  gravel(c, ev, n) {
    const a = c.actor(ev, 0, 0, 0, { perPart: true });
    const rnd = c.rng(ev), key = c.geo.rock(0);
    for (let i = 0; i < n; i++) {
      const side = i % 4, along = (rnd() * 2 - 1) * (PLOT - .5), y = -.6 - rnd() * 4.1;
      const s = .14 + rnd() * rnd() * .34;
      const p = side === 0 ? [along, y, PLOT] : side === 1 ? [PLOT, y, along] : side === 2 ? [along, y, -PLOT] : [-PLOT, y, along];
      c.add(a, key, rnd() < .5 ? 'stone' : 'stoneDark', { p, r: [rnd() * 3, rnd() * 3, rnd() * 3], s: [s * (1 + rnd() * .5), s * .72, s], rng: rnd, noCast: false });
    }
  },
  // —— 小路与栅栏 ——
  stone(c, ev, x, z) {
    const rnd = c.rng(ev), a = c.actor(ev, x, .06, z, { ry: rnd() * 3, h: 5 });
    c.add(a, c.geo.cyl(.62, .66, .13, 9), 'stone', { s: [1 + rnd() * .15, 1, .85 + rnd() * .15], rng: rnd });
  },
  post(c, ev, x, z) {
    const rnd = c.rng(ev), a = c.actor(ev, x, .75, z, { ry: (rnd() - .5) * .12, h: 5 });
    c.add(a, c.geo.box(.26, 1.5, .26), 'wood', { rng: rnd });
    c.add(a, c.geo.cone(.2, .2, 4), 'wood', { p: [0, .75, 0], r: [0, Math.PI / 4, 0], rng: rnd });
  },
  rail(c, ev, x1, z1, x2, z2) {
    const rnd = c.rng(ev), len = +Math.hypot(x2 - x1, z2 - z1).toFixed(2);
    const a = c.actor(ev, (x1 + x2) / 2, 0, (z1 + z2) / 2, { ry: Math.atan2(-(z2 - z1), x2 - x1), h: 4 });
    const key = c.geo.box(len, .13, .09);
    c.add(a, key, 'woodLight', { p: [0, .55, 0], rng: rnd });
    c.add(a, key, 'woodLight', { p: [0, 1.1, 0], rng: rnd });
  },
  // —— 小屋主体 ——
  foundation(c, ev, side) {
    const w = H.x1 - H.x0 + .24, d = H.zf - H.zb + .24, th = 1.14, y = H.y0 / 2;

      return out.makeRotationZ(side * flap).multiply(_wingBase[side > 0 ? 0 : 1]);
    };
    c.add(a, ball, tone, { dyn: wing(1), rng: rnd });
    c.add(a, ball, tone, { dyn: wing(-1), rng: rnd });
  },
  smoke(c, ev, ref) {
    const ch = c.refs[ref], a = c.actor(ev, ch.x, ch.y, ch.z, { live: true }), rnd = c.rng(ev), ball = c.geo.ball(10), N = 6, T = 5.2;
    for (let i = 0; i < N; i++) {
      const off = rnd() * 6;
      c.add(a, ball, 'puff', { noCast: true, dyn: (t, out) => {
        const q = ((t - ev.start) / T + i / N) % 1;
        const s = .34 * Math.sin(Math.PI * Math.min(1, q * 1.02)) ** .7 + .001;
        out.compose(_v2.set(Math.sin(q * 5 + off) * .32 + q * .9, q * 4.1, Math.cos(q * 4 + off) * .24), _qI, _vS.set(s * (1 + q), s * (1 + q), s * (1 + q)));
        return out;
      } });
    }
  },
  cat(c, ev, ref) {
    const a = c.actor(ev, -5.4, H.ridge + .55, H.zc, { h: 3.2 }), rnd = c.rng(ev), ball = c.geo.ball(12);
    const fur = c.color('peach', rnd);
    c.add(a, ball, fur, { p: [0, .08, 0], s: [.8, .42, .42] });
    c.add(a, ball, fur, { p: [.78, .28, .1], s: .32 });
    const ear = c.geo.cone(.1, .22, 4);
    c.add(a, ear, 'terracotta', { p: [.72, .52, .28], r: [.2, 0, -.1] });
    c.add(a, ear, 'terracotta', { p: [.86, .52, -.06], r: [-.2, 0, -.1] });
    c.add(a, ball, 'wood', { p: [1.04, .34, .25], s: .035 }); c.add(a, ball, 'wood', { p: [1.08, .34, 0], s: .035 });
    a.live = true;
    c.add(a, ball, 'terracotta', { dyn: (t, out) => {
      const w = Math.sin(t * 1.4) * .45;
      return out.compose(_v2.set(-.9, .1 + Math.abs(w) * .1, w * .55), _qI, _vS.set(.42, .09, .09));
    } });
  },
  orbit(c, ev, speed) { c.world.orbit = { start: ev.start, speed }; c.actor(ev); },
};
const _qI = new THREE.Quaternion(), _vS = new THREE.Vector3();
const _wingBase = [
  new THREE.Matrix4().makeTranslation(.17, 0, 0).multiply(new THREE.Matrix4().makeScale(.17, .012, .2)),
  new THREE.Matrix4().makeTranslation(-.17, 0, 0).multiply(new THREE.Matrix4().makeScale(.17, .012, .2)),
];

// ===================================================================
// 应用：把四层接起来，维护播放状态
// ===================================================================
const SHOWCASE_HOLD = 10;   // 开启循环时，环绕展示停留的秒数

class App {
  constructor() {
    this.t = 0; this.playing = true; this.speed = 1; this.loop = false;
    this.seed = 'cottage'; this.recorder = null;
    this.ui = new UI(this);
    const text = $('build-script').textContent.replace(/^\n/, '').replace(/\s+$/, '');
    this.timeline = new Timeline(Interpreter.parse(text));
    this.ui.setTimeline(this.timeline);
    this.world = new World($('scene'));
    this.world.onUserCamera = () => this.ui.setAutoCam(false);
    this.world.build(this.timeline, this.seed);
    this.setLight(+$('light').value); this.ui.setLightValue(+$('light').value);
    this.ui.setPlaying(true);
    const vp = $('viewport');
    const fit = () => this.world.resize(vp.clientWidth, vp.clientHeight);
    new ResizeObserver(fit).observe(vp); fit();
    this.fps = { last: performance.now(), frames: 0, value: 0 };
    this.last = performance.now();
    requestAnimationFrame(n => this.frame(n));
  }
  frame(now) {
    const dt = Math.max(0, Math.min((now - this.last) / 1000, .1));   // 首帧时间戳可能早于启动时刻
    this.last = now;
    if (this.playing) {
      this.t += dt * this.speed;
      const T = this.timeline.total;
      if (this.recorder && this.t > T + 2) this.stopRecord();
      if (this.loop && !this.recorder && this.t > T + SHOWCASE_HOLD) this.t = 0;
    }
    this.world.render(this.t);
    this.ui.update(this.t);
    const f = this.fps; f.frames++;
    if (now - f.last >= 500) {
      f.value = Math.round(f.frames * 1000 / (now - f.last)); f.frames = 0; f.last = now;
      const s = this.world.stats();
      this.ui.stats(s.tris, s.peak, f.value);
    }
    requestAnimationFrame(n => this.frame(n));
  }
  setPlaying(p) { this.playing = p; this.ui.setPlaying(p); }
  togglePlay() { this.setPlaying(!this.playing); }
  seek(t) { this.t = Math.max(0, t); }
  replay() { this.seek(0); this.setPlaying(true); if (!this.world.autoCam) this.setAutoCam(true); }
  step(dir) {
    const tl = this.timeline, tc = Math.min(this.t, tl.total), cur = tl.stageAt(tc), i = tl.stages.indexOf(cur);
    if (dir < 0) this.seek(tc - cur.start > .6 || i === 0 ? cur.start : tl.stages[i - 1].start);
    else this.seek(i < tl.stages.length - 1 ? tl.stages[i + 1].start : tl.total);
    this.ui.forceFollow = true;
  }
  jumpToLine(line) {
    const ev = this.timeline.byLine.get(line);
    if (!ev) return;
    this.setPlaying(false);
    this.seek(ev.end);
  }
  hoverLine(line) {
    if (line === this.hovered) return;   // 同一行内移动鼠标不重新触发
    this.hovered = line;
    this.world.setGlow(line);
  }
  setLight(deg) { this.world.setLight(deg); }
  setAutoCam(on) { this.world.setAutoCam(on); this.ui.setAutoCam(on); }
  setSeed(seed) {
    if (seed === this.seed) return;
    this.seed = seed;
    this.world.build(this.timeline, seed);
  }
  download(blob, name) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  exportTimeline() {
    const json = JSON.stringify(this.timeline.toJSON(this.seed), null, 2);
    this.download(new Blob([json], { type: 'application/json' }), `cottage-timeline-${this.seed}.json`);
  }
  toggleRecord() {
    if (this.recorder) { this.stopRecord(); return; }
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => window.MediaRecorder?.isTypeSupported(m));
    if (!mime) { this.ui.note('当前浏览器不支持录制 webm，请换用 Chrome、Edge 或 Firefox。'); return; }
    const stream = $('scene').captureStream(60);
    const chunks = [], rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach(tr => tr.stop());
      this.download(new Blob(chunks, { type: 'video/webm' }), `cottage-build-${this.seed}.webm`);
      this.ui.note('录制完成，视频已下载。');
    };
    this.recorder = rec;
    rec.start(250);
    this.replay();
    this.ui.setRecording(true);
    this.ui.note('正在录制整段搭建过程，播放结束会自动保存。');
  }
  stopRecord() {
    this.recorder?.stop();
    this.recorder = null;
    this.ui.setRecording(false);
  }
}

try {
  const app = new App();
  window.__cottage = app;   // 便于在控制台调试和校验
} catch (err) {
  const noGL = /WebGL/i.test(String(err.message));
  fatal(noGL ? '浏览器无法启用 WebGL' : '场景启动失败', noGL ? '请确认浏览器已开启硬件加速。' : '施工脚本或场景构建出错：', err);
  console.error(err);
}
</script>
</body>
</html>
